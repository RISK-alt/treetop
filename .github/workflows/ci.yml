name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
# main is excluded: those runs are the record of what the tip actually did,
# and cancelling one leaves a gap nobody goes back to fill.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Three separate tasks in this project's history independently introduced
  # "# define" or "# include" (a space after the '#') into a .c file - house
  # style reserves that spaced form for headers only, and every occurrence
  # was caught by a human reading the diff. This job replaces that reading.
  style-lint:
    name: style lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.repository }}
        uses: actions/checkout@v7

      - name: Reject spaced preprocessor directives in .c files
        shell: bash
        run: |
          set -eu
          violations=$(grep -rnE '^#[[:space:]]+(define|include)' --include='*.c' --exclude-dir=.git --exclude-dir=build -- . || true)
          if [ -n "$violations" ]; then
            echo "Style rule violated: '#define' and '#include' in a .c file must have no space after '#'." >&2
            echo "The spaced form ('# define' / '# include') is reserved for headers (.h) in this repository's house style." >&2
            echo "Offending lines:" >&2
            echo "$violations" >&2
            exit 1
          fi
          echo "OK: no spaced preprocessor directives in any .c file."

      - name: Reject tabs and trailing whitespace in sources
        shell: bash
        run: |
          set -eu
          status=0
          tabs=$(grep -rnP '\t' --include='*.c' --include='*.h' --exclude-dir=.git --exclude-dir=build --exclude-dir=build-asan -- . || true)
          if [ -n "$tabs" ]; then
            echo "Tabs found in a source file. This project indents with four spaces." >&2
            echo "$tabs" >&2
            status=1
          fi
          trailing=$(grep -rnE '[[:space:]]+$' --include='*.c' --include='*.h' --exclude-dir=.git --exclude-dir=build --exclude-dir=build-asan -- . || true)
          if [ -n "$trailing" ]; then
            echo "Trailing whitespace found." >&2
            echo "$trailing" >&2
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "OK: no tabs, no trailing whitespace."
          fi
          exit "$status"

      - name: Reject lines over 80 columns in sources
        shell: bash
        run: |
          set -eu
          long=$(grep -rnE '.{81,}' --include='*.c' --include='*.h' --exclude-dir=.git --exclude-dir=build --exclude-dir=build-asan -- . || true)
          if [ -n "$long" ]; then
            echo "Lines longer than 80 columns found. This project wraps at 80." >&2
            echo "$long" >&2
            exit 1
          fi
          echo "OK: nothing over 80 columns."

  # windows-latest ships MSVC but not MinGW-w64, so the mingw leg installs
  # its own toolchain via MSYS2; the msvc leg uses what's already on the
  # image. Both legs build with warnings as errors (see CMakeLists.txt), so
  # a warning on either compiler fails the build, not just a test.
  #
  # Both configurations are built because they are not the same code: Release
  # defines NDEBUG and optimises, and the two compilers warn about different
  # things at different optimisation levels. Release is what ships; Debug is
  # what a contributor bisects with.
  build:
    name: build (${{ matrix.toolchain }}, ${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [mingw, msvc]
        config: [Debug, Release]
    steps:
      - name: Check out ${{ github.repository }}
        uses: actions/checkout@v7

      - name: Set up MinGW-w64 (UCRT64)
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure (MinGW-w64)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build (MinGW-w64)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: cmake --build build

      - name: Test (MinGW-w64)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      # No -G given: this picks up the Visual Studio generator already on
      # windows-latest. -A x64 is explicit because the generator's default
      # platform is not guaranteed to be 64-bit, and 64-bit is the target.
      - name: Configure (MSVC)
        if: matrix.toolchain == 'msvc'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build (MSVC)
        if: matrix.toolchain == 'msvc'
        run: cmake --build build --config ${{ matrix.config }}

      - name: Test (MSVC)
        if: matrix.toolchain == 'msvc'
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  # The unit tests exercise the portable core, which is where the buffer
  # arithmetic lives: fixed-width column packing, wide-string truncation,
  # JSON escaping. Those are the places an off-by-one writes past the end of
  # an array rather than producing a wrong answer, and a wrong answer is the
  # only kind an ordinary test run can see. ASan sees the other kind.
  sanitize:
    name: address sanitizer
    runs-on: windows-latest
    # A sanitizer failure can present as a hang rather than a diagnostic: an
    # instrumented binary that cannot load its runtime raises a dialog, and a
    # dialog on a headless runner waits for a click that never comes. Bound
    # it, so that failure mode costs minutes rather than the job's default.
    timeout-minutes: 15
    steps:
      - name: Check out ${{ github.repository }}
        uses: actions/checkout@v7

      # CMakeLists.txt pins the static CRT because the *shipped* exe has to
      # run on a machine with nothing installed. That requirement does not
      # apply here - this build is unit tests that never leave the runner -
      # and MSVC's ASan expects the dynamic CRT, so it is overridden for this
      # build directory only. Left on /MT, the instrumented tests hang.
      - name: Configure with ASan (MSVC)
        run: >
          cmake -S . -B build-asan -A x64
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          -DCMAKE_C_FLAGS="/fsanitize=address"

      - name: Build tests
        run: cmake --build build-asan --config Debug --target treetop_tests

      # An instrumented binary links against clang_rt.asan_dynamic-x86_64.dll,
      # which lives in the MSVC toolchain and is only on PATH inside a
      # developer prompt. A GitHub step is not one. Without this the process
      # blocks before main on a missing-DLL dialog and produces no output at
      # all, which is what the first two attempts at this job did.
      #
      # The import list is printed rather than assumed: if this job ever fails
      # again, the log says whether the runtime was found and whether the exe
      # actually wanted it.
      - name: Put the ASan runtime on PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $tools = Join-Path $vs 'VC\Tools\MSVC'

          $exe = Get-ChildItem -Path build-asan -Recurse -Filter treetop_tests.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "treetop_tests.exe not found under build-asan" }
          Write-Host "test binary: $($exe.FullName)"

          $dumpbin = Get-ChildItem -Path $tools -Recurse -Filter dumpbin.exe |
                     Where-Object { $_.FullName -match 'Hostx64\\x64' } |
                     Select-Object -First 1
          if ($dumpbin) {
              Write-Host "imports:"
              & $dumpbin.FullName /nologo /dependents $exe.FullName |
                Select-String -Pattern '^\s{4}(\S+\.dll)$' |
                ForEach-Object { Write-Host "  $($_.Matches[0].Groups[1].Value)" }
          }

          $asan = Get-ChildItem -Path $tools -Recurse -Filter 'clang_rt.asan*x86_64.dll' -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'Hostx64\\x64' } |
                  Select-Object -First 1
          if ($asan) {
              Write-Host "ASan runtime: $($asan.FullName)"
              Add-Content -Path $env:GITHUB_PATH -Value $asan.DirectoryName
          } else {
              Write-Host "::warning::No clang_rt.asan*x86_64.dll found under $tools"
          }

      # The suite runs in well under a second uninstrumented, so anything
      # approaching this limit is a hang, not slow instrumentation.
      - name: Run tests under ASan
        run: ctest --test-dir build-asan -C Debug --output-on-failure --timeout 180
